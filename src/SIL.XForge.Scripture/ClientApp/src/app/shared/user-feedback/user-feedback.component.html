<ng-container *transloco="let t; read: 'user_feedback'">
  <app-notice type="primary" mode="basic" icon="feedback">
    {{ t("how_has_drafting_helped_your_project", { siteName }) }}
    <a href="javascript:;" (click)="onSendFeedback()">{{ t("send_feedback") }}</a>
    {{ t("or") }}
    <a target="_blank" [href]="issueMailTo">{{ t("ask_for_help") }}</a>
  </app-notice>
</ng-container>
