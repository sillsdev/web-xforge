allowBuilds:
  "@compodoc/compodoc": true
  "@parcel/watcher": true
  "@swc/core": true
  browser-tabs-lock: true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  unrs-resolver: true
minimumReleaseAge: 10080 # 7 days
minimumReleaseAgeExclude:
  - ajv@8.18.0
  - picomatch@4.0.4
  - uuid@11.1.1
  - ws@8.21.0
  - '@babel/core@7.29.1'
  - webpack-dev-server@5.2.6
  - '@hono/node-server@2.0.5'
  - image-size@2.0.3
  - esbuild@0.28.1
  - hono@4.12.34
  - nanoid@3.3.18
  - postcss@8.5.18
  - postcss@8.5.23
  - qs@6.15.4
  - qs@6.16.0
  - '@xmldom/xmldom@0.9.12'
  - fast-uri@3.1.6
overrides:
  "webpack": "5.105.0" # Fix for @storybook/builder-webpack5. Remove if updating Angular
patchedDependencies:
  http-proxy@1.18.1: patches/http-proxy@1.18.1.patch
