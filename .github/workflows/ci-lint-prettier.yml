# This workflow will do a clean install of node dependencies, and then check lint and prettier formatting.
# It also runs the C# checks that the pre-commit hook applies (see .lintstagedrc.yml), so that code which was
# committed without the hook running is still caught.
# See: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Lint and Prettier
permissions: {}

on:
  push:
    branches: [master, develop, sf-qa, sf-live]
  pull_request:
  merge_group:

jobs:
  test:
    name: Lint and Prettier
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node_version: ["22.13.0"]
        npm_version: ["11.11.0"]
        pnpm_version: ["11.10.0"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: "Deps: pnpm"
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: ${{matrix.pnpm_version}}
      - name: Use Node.js ${{matrix.node_version}}
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: ${{matrix.node_version}}
          cache: "pnpm"
          cache-dependency-path: |
            src/SIL.XForge.Scripture/ClientApp/pnpm-lock.yaml
            src/RealtimeServer/pnpm-lock.yaml
      - name: Upgrade npm
        env:
          NPM_VERSION: ${{matrix.npm_version}}
        run: |
          set -xueo pipefail
          npm install --global npm@${NPM_VERSION}
      - name: Realtime Server Lint check
        run: cd src/RealtimeServer && (pnpm ci || (sleep 3m && pnpm ci)) && pnpm run lint
      - name: Realtime Server Prettier format check
        run: cd src/RealtimeServer && pnpm run prettier:ci
      - name: Angular Frontend Lint check
        run: cd src/SIL.XForge.Scripture/ClientApp && (pnpm ci || (sleep 3m && pnpm ci)) && pnpm run lint
      - name: Angular Frontend Prettier format check
        run: cd src/SIL.XForge.Scripture/ClientApp && pnpm run prettier:ci

  csharp:
    name: C# Lint and Format
    runs-on: ubuntu-latest

    strategy:
      matrix:
        dotnet_version: ["10.0.x"]

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: "Deps: .NET"
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: ${{matrix.dotnet_version}}
          cache: true
          cache-dependency-path: src/SIL.XForge.Scripture/packages.lock.json
      - name: "Deps: dotnet tools"
        run: dotnet tool restore
      - name: "Deps: Backend nuget"
        run: dotnet restore xForge.slnx
      # These are the same checks that .lintstagedrc.yml applies to staged *.cs files, but in verify mode and
      # across the whole solution instead of only the files being committed.
      - name: C# analyzers check
        run: dotnet format analyzers --verify-no-changes --no-restore xForge.slnx
      - name: C# code style check
        run: dotnet format style --verify-no-changes --no-restore xForge.slnx
      - name: C# CSharpier format check
        run: dotnet csharpier check .
