<ng-container *transloco="let t; read: 'translator_settings_dialog'">
  <h1 mat-dialog-title>{{ t("translator_settings") }}</h1>
  <mat-dialog-content>
    @if (showLynxSettings) {
      <mat-card>
        <mat-card-content>
          <div class="card-header-with-toggle">
            <mat-slide-toggle
              id="lynx-master-switch"
              [formControl]="lynxMasterSwitch"
              (change)="setLynxMasterEnabled($event.checked)"
            >
              <span class="card-title toggle-label">{{ t("insights_settings_title") }}</span>
            </mat-slide-toggle>
          </div>

          <div class="settings-content lynx-sub-settings">
            @if (lynxAssessmentsProjectEnabled) {
              <mat-slide-toggle
                id="lynx-assessments-enabled"
                [formControl]="lynxAssessmentsEnabled"
                (change)="setLynxAssessmentsEnabled($event.checked)"
              >
                <span class="toggle-label">{{ t("insights_enable_assessments") }}</span>
              </mat-slide-toggle>
            }
            @if (lynxAutoCorrectProjectEnabled) {
              <mat-slide-toggle
                id="lynx-autocorrect-enabled"
                [formControl]="lynxAutoCorrectEnabled"
                (change)="setLynxAutoCorrectEnabled($event.checked)"
              >
                <span class="toggle-label">{{ t("insights_enable_autocorrect") }}</span>
              </mat-slide-toggle>
            }
          </div>
        </mat-card-content>
      </mat-card>
    }
  </mat-dialog-content>
  <mat-dialog-actions>
    <button mat-button mat-dialog-close>{{ t("close") }}</button>
  </mat-dialog-actions>
</ng-container>
