<ng-container *transloco="let t; read: 'draft_confidence'">
  @if (lowConfidence) {
    @if (showText) {
      <div class="confidence red">
        <mat-icon [matTooltip]="t('low_confidence')">warning</mat-icon>
        <span>{{ t("low_confidence") }}</span>
      </div>
    } @else {
      <mat-icon [matTooltip]="t('low_confidence')" class="red">warning</mat-icon>
    }
  }
</ng-container>
